<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velo Chat App</title>
    <link rel="stylesheet" href="style.css">
    <script src="/socket.io/socket.io.js" defer></script>
    <script src="app.js" defer></script>
</head>
<body>

    <!-- Auth Screen -->
    <div id="auth-screen" class="auth-container">
        <div class="auth-card">
            <div class="tabs">
                <button id="tab-login" class="tab active">Login</button>
                <button id="tab-signup" class="tab">Sign Up</button>
            </div>

            <!-- Login Form -->
            <form id="login-form">
                <h2>Welcome Back</h2>
                <input type="text" id="login-username" placeholder="Username" required>
                <input type="password" id="login-password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>

            <!-- Sign Up Form -->
            <form id="signup-form" class="hidden">
                <h2>Create Account</h2>
                <input type="text" id="signup-username" placeholder="Username" required>
                <input type="password" id="signup-password" placeholder="Password" required>
                <input type="text" id="signup-avatar" placeholder="Avatar URL (Optional)">
                <button type="submit">Sign Up</button>
            </form>

            <p id="auth-error" class="error-msg"></p>
        </div>
    </div>

    <!-- Chat Dashboard -->
    <div id="chat-dashboard" class="chat-container hidden">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="my-profile">
                <img id="my-avatar" class="avatar" src="" alt="Avatar">
                <span id="my-username"></span>
                <div class="profile-actions">
                    <button id="logout-btn" title="Logout">🚪 Logout</button>
                    <button id="delete-acc-btn" title="Delete Account">🗑️</button>
                </div>
            </div>
            <div class="search-box">
                <input type="text" id="search-user-input" placeholder="Search registered contacts...">
            </div>
            <ul id="user-list"></ul>
        </div>

        <!-- Chat Main Area -->
        <div class="chat-main">
            <div class="chat-header">
                <button id="back-to-users-btn" class="mobile-only">←</button>
                <span id="chat-with-status">Select a user to chat</span>
                <button id="video-call-btn" class="video-call-header-btn hidden" title="Start Video Call">📹 Video Call</button>
            </div>

            <div id="messages-box" class="messages-box"></div>

            <div class="chat-input-bar">
                <label for="file-input" class="icon-btn" title="Attach File">📎</label>
                <input type="file" id="file-input" class="hidden">
                <button id="mic-btn" class="icon-btn" title="Record Voice Note">🎙️</button>
                <input type="text" id="message-input" placeholder="Type a message...">
                <button id="send-btn">Send</button>
            </div>
        </div>
    </div>

    <!-- Video Call Modal -->
    <div id="video-modal" class="modal hidden">
        <div class="video-container">
            <video id="remote-video" autoplay playsinline></video>
            <video id="local-video" autoplay playsinline muted></video>
            <button id="end-call-btn" class="call-end-btn">End Call</button>
        </div>
    </div>

    <!-- Incoming Call Modal -->
    <div id="incoming-call-modal" class="modal hidden">
        <div class="incoming-card">
            <h3 id="caller-name">Incoming Call...</h3>
            <div class="incoming-actions">
                <button id="accept-call-btn" class="btn-accept">Accept</button>
                <button id="reject-call-btn" class="btn-reject">Decline</button>
            </div>
        </div>
    </div>

</body>
</html>
