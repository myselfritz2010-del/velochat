<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velo Chat App</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Load Socket.io via CDN for Netlify compatibility -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    
    <!-- Deferred application logic script -->
    <script src="app.js?v=4" defer></script>
</head>
<body>

    <!-- Authentication Screen -->
    <div id="auth-screen" class="auth-container">
        <div class="auth-card">
            <h2>VeloChat</h2>
            <div class="auth-tabs">
                <button id="tab-login" class="tab-btn active">Login</button>
                <button id="tab-signup" class="tab-btn">Sign Up</button>
            </div>

            <form id="login-form" class="auth-form">
                <input type="text" id="login-username" placeholder="Username" required />
                <input type="password" id="login-password" placeholder="Password" required />
                <button type="submit" class="submit-btn">Login</button>
            </form>

            <form id="signup-form" class="auth-form hidden">
                <input type="text" id="signup-username" placeholder="Choose Username" required />
                <input type="password" id="signup-password" placeholder="Choose Password" required />
                <input type="url" id="signup-avatar" placeholder="Avatar Image URL (Optional)" />
                <button type="submit" class="submit-btn">Create Account</button>
            </form>

            <p id="auth-error" class="error-msg"></p>
        </div>
    </div>

    <!-- Main Chat Dashboard Screen -->
    <div id="chat-dashboard" class="chat-container hidden">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="user-profile">
                <img id="my-avatar" src="" alt="Profile" class="avatar">
                <span id="my-username">User</span>
                <button id="logout-btn" class="icon-btn" title="Logout">🚪</button>
                <button id="delete-acc-btn" class="icon-btn danger" title="Delete Account">🗑️️</button>
            </div>
            
            <div class="search-bar">
                <input type="text" id="search-user-input" placeholder="Search contacts..." />
            </div>

            <ul id="user-list" class="users-list"></ul>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-area">
            <header class="chat-header">
                <button id="back-to-users-btn" class="mobile-only-btn">← Back</button>
                <h3 id="chat-with-status">Select a user to start chatting</h3>
                <button id="video-call-btn" class="icon-btn hidden">📹 Video Call</button>
            </header>

            <div id="messages-box" class="messages-box"></div>

            <footer class="chat-footer">
                <input type="file" id="file-input" style="display: none;" />
                <button class="icon-btn" onclick="document.getElementById('file-input').click()">📎</button>
                <button id="mic-btn" class="icon-btn">🎤</button>
                <input type="text" id="message-input" placeholder="Type a message..." />
                <button id="send-btn" class="submit-btn">Send</button>
            </footer>
        </main>
    </div>

    <!-- Video Call Modal -->
    <div id="video-modal" class="modal hidden">
        <div class="video-container">
            <video id="remote-video" autoplay playsinline></video>
            <video id="local-video" autoplay playsinline muted></video>
            <button id="end-call-btn" class="btn-danger">End Call</button>
        </div>
    </div>

    <!-- Incoming Call Modal -->
    <div id="incoming-call-modal" class="modal hidden">
        <div class="modal-card">
            <h3 id="caller-name">Incoming Call...</h3>
            <div class="modal-actions">
                <button id="accept-call-btn" class="submit-btn">Accept</button>
                <button id="reject-call-btn" class="btn-danger">Reject</button>
            </div>
        </div>
    </div>

</body>
</html>
